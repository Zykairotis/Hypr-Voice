# WhisperLive Hybrid Configuration for Hypr-Voice

# Server Settings
server:
  host: "0.0.0.0"  # Listen on all interfaces for hybrid mode
  port: 9099
  max_clients: 10  # Support more clients with hybrid approach
  max_connection_time: 3600  # 1 hour for longer sessions

# Backend Configuration
backend:
  type: "faster_whisper"  # Options: faster_whisper, tensorrt, openvino
  model_path: "small.en"  # English-only: +2-3% accuracy, 92% base, ~97-99% with all enhancements
  device: "cuda"  # Options: cpu, cuda
  language: "en"  # English for small.en model
  translate: false  # Don't translate to English by default

# Performance Settings
performance:
  omp_num_threads: 8  # Increased for CPU parallelization (set to your CPU core count)
  cache_path: "/tmp/whisper-live-cache"
  audio_chunk_size: 2048
  sample_rate: 16000

# Logging
logging:
  level: "DEBUG"  # Options: DEBUG, INFO, WARNING, ERROR - Using DEBUG to see segment details
  file: "/tmp/whisper-live-hypr-voice.log"

# Hypr-Voice Integration
hypr_voice:
  enabled: true
  socket_path: "/tmp/hypr-voice-whisper.sock"
  vad_enabled: true  # Voice Activity Detection
  vad_threshold: 0.5  # Balanced sensitivity (0.5 normal)
  min_speech_duration: 0.3  # seconds
  max_silence_duration: 1.5  # seconds

# Enable TCPGen for 20-40% improvement on custom vocabulary recognition
tcpgen_enabled: true

# Audio Settings for Hyprland
audio:
  input_device: "Generic USB Audio"  # USB microphone
  pulseaudio_source: "alsa_input.usb-Generic_USB_Audio-00.HiFi__Mic1__source"  # Actual microphone (not monitor)
  device_index: null  # Not using index, using device name instead
  sample_rate: 16000
  channels: 1
  format: "s16le"
  buffer_size: 1024

# Model Settings
model:
  download_root: "/tmp/whisper-models"
  local_files_only: false
  compute_type: "float16"  # CUDA float16: balanced speed and accuracy
  num_workers: 4  # Increased for better CPU utilization
  cpu_threads: 8  # Match your CPU threads (or use physical cores)

# Hybrid Mode Settings
hybrid:
  enabled: true
  protocol: "both"  # Options: websocket, rest, both
  rest_api:
    enabled: true
    max_upload_size: 500  # MB
    allowed_formats: ["wav", "mp3", "mp4", "mkv", "flac", "m4a", "ogg", "webm"]
    job_queue: true
    cleanup_after: 3600  # seconds
  websocket:
    enabled: true
    heartbeat_interval: 30  # seconds
    max_message_size: 10  # MB
  shared_model: true  # Share model instance between REST and WebSocket

# API Settings
api:
  cors_origins: ["*"]  # Allow all origins for testing
  authentication: false  # No auth for now
  rate_limiting: false
  docs_enabled: true  # Enable FastAPI docs at /docs

# Orchestrator Settings
orchestrator:
  permission_timeout: 30

# Custom Vocabulary Enhancement
vocabulary:
  enabled: true
  config_path: "config/vocabulary.yaml"
  enhancement_method: "initial_prompt"  # Changed from prompt_engineering (research-proven best practice)
  
  # Initial prompt optimization (research-proven comma-separated format)
  initial_prompt:
    enabled: true
    max_tokens: 200  # Conservative limit (224 max for Whisper)
    max_chars: 800   # Approximately 200 tokens (~4 chars per token)
    format: "comma_list"  # Research-proven: comma-separated lists are most effective
    carry_forward: true  # Persist vocabulary across 30s chunks
  
  # Fallback on hallucination detection
  hallucination_detection:
    enabled: true
    repetition_threshold: 3  # Detect 3+ consecutive identical segments
    retry_without_prompt: true  # Retry transcription without prompt if hallucination detected
  
  # Legacy settings (deprecated, keeping for backward compatibility)
  custom_words:
    - "YourCustomTerm"
    - "YourAppName"
    - "YourTechnicalWord"
  prompt_context: "Focus on accurate transcription of technical terms including: React, TypeScript, Docker, Kubernetes, Git, npm, Python, JavaScript, API, REST, GraphQL, and user-defined terms."

# CTranslate2 Settings - Optimized for MAXIMUM ACCURACY
ctranslate2:
  inter_threads: 4  # Inter-op parallelism (process multiple batches)
  intra_threads: 8  # Intra-op parallelism (parallelize within operations)
  beam_size: 5  # Increased for +3-5% accuracy (best quality)
  patience: 2.0  # Increased for +1-2% accuracy
  length_penalty: 1.0
  temperature: 0.0  # Deterministic output for consistency
  compression_ratio_threshold: 2.4
  log_prob_threshold: -1.0
  no_speech_threshold: 0.4  # Lowered for +1% accuracy (better speech detection)
