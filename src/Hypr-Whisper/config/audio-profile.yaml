alsa:
  suppress_warnings: true
  use_pulseaudio_only: true
audio:
  channels: 1
  chunk_size: 2048
  format: int16
  sample_rate: 16000
pulseaudio:
  default_source: GA102 High Definition Audio Controller
  device_name: GA102 High Definition Audio Controller Digital Stereo (HDMI)
  device_type: monitor
recording:
  auto_cleanup:
    days_to_keep: 7
    enabled: false
  channels: 1
  format: wav
  sample_rate: 16000
  save_recordings: false
