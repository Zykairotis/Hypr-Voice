# Hypr-Voice Bridge API Configuration

# Server settings
server:
  host: "0.0.0.0"
  port: 8435
  reload: false
  log_level: "info"

# Unix socket settings
unix_socket:
  path: "/tmp/hypr-voice.sock"
  timeout: 5.0

# Log streaming settings
log_streaming:
  log_directory: "/tmp"
  check_interval: 0.1  # seconds
  max_recent_entries: 50
  log_files:
    server: "/tmp/hypr-voice-server.log"
    client: "/tmp/hypr-voice-client.log"
    agent: "/tmp/hypr-voice-logs/agent.log"

# Hypr-Voice service
hypr_voice:
  script_path: null  # Auto-detect if null
  process_name: "hypr-voice"

# CORS settings (configure for production)
cors:
  allow_origins: ["*"]
  allow_credentials: true
  allow_methods: ["*"]
  allow_headers: ["*"]

# WebSocket settings
websocket:
  ping_interval: 20.0
  ping_timeout: 10.0
  max_connections: 100

# API settings
api:
  title: "Hypr-Voice Bridge API"
  description: "HTTP to Unix socket bridge for Hypr-Voice control"
  version: "1.0.0"
  docs_url: "/docs"
  redoc_url: "/redoc"

# Monitoring and metrics
monitoring:
  enable_metrics: true
  metrics_interval: 60  # seconds
  health_check_interval: 30  # seconds

# Security settings
security:
  rate_limiting:
    enabled: false
    requests_per_minute: 60
  authentication:
    enabled: false
    api_key: null