<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hypr-Voice Log Viewer</title>
    <meta name="description" content="Advanced real-time log viewer for Hypr-Voice with WebSocket streaming, search, filters, and export capabilities" />
    <meta name="keywords" content="log viewer, real-time, websocket, hypr-voice, react, typescript" />
    <meta name="author" content="Hypr-Voice Team" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://hypr-voice.github.io/log-viewer/" />
    <meta property="og:title" content="Hypr-Voice Log Viewer" />
    <meta property="og:description" content="Advanced real-time log viewer for Hypr-Voice with WebSocket streaming, search, filters, and export capabilities" />
    <meta property="og:image" content="/og-image.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://hypr-voice.github.io/log-viewer/" />
    <meta property="twitter:title" content="Hypr-Voice Log Viewer" />
    <meta property="twitter:description" content="Advanced real-time log viewer for Hypr-Voice with WebSocket streaming, search, filters, and export capabilities" />
    <meta property="twitter:image" content="/twitter-image.png" />

    <!-- Preconnect to improve performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

    <!-- Theme color -->
    <meta name="theme-color" content="#667eea" />

    <!-- Apple touch icon -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <style>
      /* Critical CSS for preventing flash of unstyled content */
      body {
        margin: 0;
        padding: 0;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
          'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
          sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background-color: #f5f5f5;
        color: #333;
        line-height: 1.6;
      }

      #root {
        min-height: 100vh;
      }

      /* Loading state */
      .loading {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        font-family: 'JetBrains Mono', monospace;
      }

      .loading-spinner {
        width: 40px;
        height: 40px;
        border: 4px solid rgba(255, 255, 255, 0.3);
        border-top: 4px solid white;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-right: 1rem;
      }

      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      /* Dark mode support */
      @media (prefers-color-scheme: dark) {
        body {
          background-color: #1a1a1a;
          color: #e0e0e0;
        }
      }

      /* Reduced motion support */
      @media (prefers-reduced-motion: reduce) {
        .loading-spinner {
          animation: none;
        }
      }

      /* High contrast mode support */
      @media (prefers-contrast: high) {
        body {
          background: white;
          color: black;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Loading state shown while React app loads -->
      <div class="loading">
        <div class="loading-spinner"></div>
        <div>
          <h1>Hypr-Voice Log Viewer</h1>
          <p>Loading advanced log viewer...</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
