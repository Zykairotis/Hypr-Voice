# Multi-Agent Orchestration System Configuration

server:
  host: "0.0.0.0"
  port: 8922
  log_level: "INFO"
  workers: 4
  reload: false
  cors:
    allow_origins: ["*"]
    allow_credentials: true
    allow_methods: ["*"]
    allow_headers: ["*"]

defaults:
  model: "claude-3-5-sonnet-20241022"
  max_tokens: 8096
  temperature: 1.0
  working_directory: "/tmp/agents"
  default_skills:
    - file_operations
    - bash_execution
  timeout: 300  # seconds

# MCP Server Configurations
mcp_servers:
  filesystem:
    command: "npx"
    args: ["-y", "@modelcontextprotocol/server-filesystem", "/"]
    description: "File system operations MCP server"
    enabled: true
    auto_restart: true
    timeout: 30
    
  github:
    command: "npx"
    args: ["-y", "@modelcontextprotocol/server-github"]
    env:
      GITHUB_TOKEN: "${GITHUB_TOKEN}"
    description: "GitHub operations MCP server"
    enabled: true
    
  git:
    command: "npx"
    args: ["-y", "@modelcontextprotocol/server-git"]
    description: "Git operations MCP server"
    enabled: true
    
  brave-search:
    command: "npx"
    args: ["-y", "@modelcontextprotocol/server-brave-search"]
    env:
      BRAVE_API_KEY: "${BRAVE_API_KEY}"
    description: "Brave web search MCP server"
    enabled: false
    
  postgres:
    command: "npx"
    args: ["-y", "@modelcontextprotocol/server-postgres"]
    env:
      DATABASE_URL: "${DATABASE_URL}"
    description: "PostgreSQL database MCP server"
    enabled: false
    
  sqlite:
    command: "npx"
    args: ["-y", "@modelcontextprotocol/server-sqlite", "/tmp/database.db"]
    description: "SQLite database MCP server"
    enabled: false
    
  fetch:
    command: "npx"
    args: ["-y", "@modelcontextprotocol/server-fetch"]
    description: "HTTP fetch MCP server"
    enabled: true
    
  puppeteer:
    command: "npx"
    args: ["-y", "@modelcontextprotocol/server-puppeteer"]
    description: "Browser automation MCP server"
    enabled: false

# Skills Configuration
skills:
  file_operations:
    enabled: true
    description: "Read, write, and manipulate files"
    
  bash_execution:
    enabled: true
    description: "Execute bash commands"
    timeout: 60
    
  voice_synthesis:
    enabled: true
    description: "Convert text to speech using Kokoro TTS"
    default_voice: "af_bella"
    
  hierarchical_agents:
    enabled: true
    description: "Create and manage sub-agents"
    max_subagents: 10
    
  web_search:
    enabled: false
    description: "Search the web"
    provider: "brave"

# Voice Configuration
voice:
  # Default provider selection
  default_provider: "kokoro"  # kokoro, elevenlabs, deepgram
  fallback_provider: "deepgram"  # Fallback if primary fails
  auto_fallback: true
  
  # Kokoro TTS (Local, Free)
  kokoro:
    enabled: true
    default_voice: "af_bella"
    cache_enabled: true
    cache_dir: "/tmp/kokoro_cache"
    sample_rate: 24000
    phonemizer: "espeak"  # espeak or gruut
    
  # ElevenLabs (Cloud, Premium Quality)
  elevenlabs:
    enabled: true
    api_key: "${ELEVENLABS_API_KEY}"  # Set in .env
    default_voice: "rachel"
    model: "eleven_multilingual_v2"  # or eleven_flash_v2_5, eleven_turbo_v2_5
    output_format: "mp3_44100_128"
    stability: 0.5
    similarity_boost: 0.5
    style: 0.0
    use_speaker_boost: true
    cache_enabled: true
    cache_dir: "/tmp/elevenlabs_cache"
    
  # Deepgram (Cloud, Fast & Natural)
  deepgram:
    enabled: true
    api_key: "${DEEPGRAM_API_KEY}"  # Set in .env
    default_voice: "asteria"  # aura-asteria-en
    language: "en"
    sample_rate: 24000
    encoding: "mp3"  # mp3, wav, pcm, opus, flac
    cache_enabled: true
    cache_dir: "/tmp/deepgram_cache"
    
  # Voice presets for different contexts
  presets:
    professional:
      kokoro: {voice: "af_bella", speed: 1.0, pitch: 1.0}
      elevenlabs: {voice: "rachel", stability: 0.7, similarity_boost: 0.7}
      deepgram: {voice: "asteria", speaking_rate: 1.0}
      
    friendly:
      kokoro: {voice: "af_sky", speed: 1.1, pitch: 1.1}
      elevenlabs: {voice: "bella", stability: 0.5, similarity_boost: 0.8}
      deepgram: {voice: "luna", speaking_rate: 1.1}
      
    technical:
      kokoro: {voice: "am_adam", speed: 0.95, pitch: 0.95}
      elevenlabs: {voice: "adam", stability: 0.8, similarity_boost: 0.6}
      deepgram: {voice: "orion", speaking_rate: 0.95}
      
    narrator:
      kokoro: {voice: "bm_george", speed: 0.9, pitch: 0.95}
      elevenlabs: {voice: "antoni", stability: 0.9, similarity_boost: 0.7}
      deepgram: {voice: "zeus", speaking_rate: 0.9}

# Agent Limits
limits:
  max_agents: 50
  max_conversation_length: 100
  max_subagents_per_agent: 10
  max_parallel_executions: 5
  max_workflow_steps: 50

# WebSocket Configuration
websocket:
  ping_interval: 30
  ping_timeout: 10
  max_connections_per_client: 5
  message_queue_size: 1000

# Storage Configuration
storage:
  agent_data_dir: "/tmp/agents/data"
  session_dir: "/tmp/agents/sessions"
  logs_dir: "/tmp/agents/logs"
  cleanup_after_hours: 24

# Monitoring
monitoring:
  enabled: true
  metrics_port: 9090
  health_check_interval: 60
  
# Security
security:
  api_key_required: false
  api_key: "${API_KEY}"
  allowed_ips: []
  rate_limit:
    enabled: true
    requests_per_minute: 60
    
# Development
development:
  debug: false
  auto_reload: false
  mock_mode: false  # Use mock responses when services unavailable

# Claude SDK Configuration
claude_sdk:
  enabled: true
  use_code_sdk: true  # Use Claude Code instance instead of API
  config_file: "claude-sdk.yaml"  # Detailed SDK configuration
  
  # Application monitoring for context-aware responses
  monitoring:
    enabled: true
    interval: 0.15  # 150ms update interval
    include_vocabulary: true
    
  # Default agent settings for Claude Code
  defaults:
    enable_monitoring: true
    monitor_interval: 0.15
    use_claude_code: true
