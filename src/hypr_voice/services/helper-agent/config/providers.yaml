# Provider Selection Strategy
selection_strategy:
  # How to select provider when "auto" is specified
  mode: "smart"  # smart, round_robin, cheapest, fastest, quality
  
  # Smart selection criteria (used when mode=smart)
  smart_criteria:
    - name: "cost"
      weight: 0.3
    - name: "speed"
      weight: 0.3
    - name: "reliability"
      weight: 0.2
    - name: "quality"
      weight: 0.2
  
  # Task-specific provider preferences
  task_preferences:
    summarization:
      preferred: ["claude", "openai", "groq"]
      avoid: []
    analysis:
      preferred: ["claude", "openai", "grok"]
      avoid: []
    planning:
      preferred: ["openai", "claude", "mistral"]
      avoid: []
    code_generation:
      preferred: ["openai", "claude", "ollama"]
      avoid: []
    general_chat:
      preferred: ["groq", "openai", "claude"]
      avoid: []
    tool_use:
      preferred: ["openai", "claude", "groq"]
      avoid: ["perplexity", "sglang"]

# Load Balancing Configuration
load_balancing:
  enabled: true
  strategy: "least_loaded"  # least_loaded, round_robin, weighted
  track_metrics: true
  cooldown_period: 60  # seconds before retrying failed provider

# Caching Configuration
caching:
  enabled: true
  ttl: 3600  # seconds
  max_cache_size: 1000
  cache_embeddings: true
  cache_completions: false  # Usually unique

# Monitoring Configuration
monitoring:
  track_latency: true
  track_costs: true
  track_errors: true
  log_requests: true
  log_responses: false  # Can be verbose
  metrics_export: true
  export_format: "prometheus"  # prometheus, json, csv

