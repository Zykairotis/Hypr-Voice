# Multi-Provider Configuration for Helper Agent
# Supports 10+ LLM providers via LiteLLM + SGLang custom integration

# Global Provider Settings
global:
  default_provider: "auto"  # auto, openai, claude, groq, etc.
  fallback_enabled: true
  fallback_chain:
    - openai
    - claude
    - groq
    - ollama
    - sglang
  max_retries: 3
  retry_delay: 1.0
  timeout: 30
  cost_tracking: true
  usage_logging: true

# Provider Configurations
providers:
  # OpenAI Configuration
  openai:
    enabled: true
    api_key_env: "OPENAI_API_KEY"
    base_url: "https://api.openai.com/v1"
    models:
      gpt-4-turbo:
        max_tokens: 4096
        context_window: 128000
        cost_per_1k_prompt: 0.01
        cost_per_1k_completion: 0.03
        supports_streaming: true
        supports_tools: true
      gpt-4:
        max_tokens: 4096
        context_window: 8192
        cost_per_1k_prompt: 0.03
        cost_per_1k_completion: 0.06
        supports_streaming: true
        supports_tools: true
      gpt-3.5-turbo:
        max_tokens: 4096
        context_window: 16385
        cost_per_1k_prompt: 0.0005
        cost_per_1k_completion: 0.0015
        supports_streaming: true
        supports_tools: true
    default_model: "gpt-3.5-turbo"
    rate_limit:
      requests_per_minute: 60
      tokens_per_minute: 90000
    parameters:
      temperature: 0.7
      top_p: 1.0
      frequency_penalty: 0.0
      presence_penalty: 0.0

  # Anthropic Claude Configuration
  claude:
    enabled: true
    api_key_env: "ANTHROPIC_API_KEY"
    base_url: "https://api.anthropic.com"
