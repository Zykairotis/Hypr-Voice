      - "echo 'Messaging context active'"
      - "hyprctl activewindow -j 2>/dev/null || true"
    
    llm_config:
      provider: xai
      model: grok-3-mini  
      temperature: 0.6
      max_tokens: 10000 
    
    output_format: text
    memory_scope: session
    memory_tags: ["messaging", "chat", "communication"]
    context_window_size: 4096
    dataset_name: "instant_messaging_context"
    
    shortcuts:
      send: "Enter"
      newline: "Shift+Enter"
      search: "Ctrl+F"
      bold: "Ctrl+B"
      italic: "Ctrl+I"
      code_block: "Ctrl+Shift+C"
    
    patterns:
      - "*Telegram*"
      - "*Discord*"
      - "*Slack*"
