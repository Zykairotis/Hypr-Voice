# Application Profiles for Hypr-Voice (Enhanced & Modular)
# Focus: Core functionality over specific application names
# Structure: Shared templates with specialized overrides

# =============================================================================
# SHARED TEMPLATE DEFINITIONS
# =============================================================================

templates:
  # Core web browsing functionality
  web_browser: &web_browser
    app_name: web_browser
    app_class: web_browser
    writing_style: adaptive
    context_rules:
      - Adapt tone based on website context (formal for business, casual for social)
      - Improve grammar and spelling while maintaining intent
      - Consider web form context (search, comments, posts, messages)
      - Preserve URLs, links, and technical terms exactly
      - Handle various input types with appropriate formatting
      - Maintain platform-appropriate tone and character limits
      - Preserve hashtags, mentions, and special formatting
      - Optimize for web accessibility and clarity
    
    abbreviations:
      url: web address
      www: world wide web
      html: hypertext markup language
      js: javascript
      css: cascading style sheets
      http: hypertext transfer protocol
      https: secure hypertext transfer protocol
      ftp: file transfer protocol
      dns: domain name system
      ip: internet protocol
      vpn: virtual private network
      seo: search engine optimization
      crm: customer relationship management
      cms: content management system
      api: application programming interface
      saas: software as a service
      paas: platform as a service
      iaas: infrastructure as a service
      json: javascript object notation
      xml: extensible markup language
      rss: really simple syndication
      cdn: content delivery network
      ssl: secure sockets layer
      tls: transport layer security
      oauth: open authorization
      jwt: json web token
    
    terminology:
      - browser
      - webpage
      - website
      - bookmark
      - history
      - cookie
      - cache
      - session
      - download
      - upload
      - streaming
      - plugin
      - extension
      - tab management
      - private browsing
      - search engine
      - social media
      - e-commerce
      - web application
      - cloud service
      - responsive design
      - user interface
      - user experience
    
    extra_context:
      - "date '+%A, %B %d, %Y at %I:%M %p'"
      - "echo 'Web browsing session active'"
      - "xprop -id $(xprop -root _NET_ACTIVE_WINDOW | cut -d' ' -f5) WM_NAME 2>/dev/null | cut -d'\"' -f2 || echo 'Browser'"
      - "hyprctl activewindow -j 2>/dev/null || true"
      - "hyprctl -j activeworkspace 2>/dev/null || true"
    
    llm_config:
      provider: xai
      model: grok-3-mini
      temperature: 0.7
      max_tokens: 10000
    
    output_format: text
    memory_scope: session
    memory_tags: ["web", "browser", "navigation", "search"]
    context_window_size: 4096
    dataset_name: "web_browser_context"
    
    shortcuts:
      new_tab: "Ctrl+T"
      close_tab: "Ctrl+W"
      reopen_tab: "Ctrl+Shift+T"
      find: "Ctrl+F"
      bookmark: "Ctrl+D"
      refresh: "F5"
      back: "Alt+Left"
      forward: "Alt+Right"
      dev_tools: "F12"
      
    patterns:
      - "*Mozilla Firefox*"
      - "*Google Chrome*"
      - "*Chromium*"
      - "*Brave*"
      - "*Microsoft Edge*"
      - "*Safari*"
      - "*Opera*"
      - "*Vivaldi*"
      
    mcp_tools:
      - "Perplexity-search"
      - "exa"
      - "Firecrawl-sr5jcg"
      - "Context7"
      - "wikipedia-mcp"
      - "playwright-mcp"
    
    system_prompt: |
      You are an intelligent web browsing writing assistant that adapts to different online contexts.

      CONTEXT ADAPTATION:
      - Business/Professional sites: Formal, clear, and professional language
      - Social Media platforms: Engaging, conversational, and community-appropriate
      - Forums and communities: Match community tone while maintaining clarity
      - Search interfaces: Optimize queries for relevant, accurate results
      - E-commerce platforms: Clear product descriptions and helpful reviews
      - Educational platforms: Maintain academic tone with proper citations
      - News and media sites: Respectful commenting with factual basis

      TECHNICAL PRECISION:
      - Preserve all URLs, email addresses, and technical specifications
      - Maintain hashtags, mentions, and platform-specific formatting
      - Optimize content for platform character limits and constraints
      - Handle form fields appropriately (concise for names, detailed for descriptions)
      - Ensure proper link formatting and accessibility

      QUALITY STANDARDS:
      - Improve grammar, spelling, and clarity while preserving original intent
      - Maintain authentic voice while enhancing professionalism
      - Consider cultural context and international audiences
      - Optimize for readability and engagement across devices

  # Development environment functionality
  code_editor: &code_editor
    app_name: code_editor
    app_class: code_editor
    writing_style: technical_precise
    context_rules:
      - Preserve exact code syntax, indentation, and formatting
      - Follow language-specific conventions and style guides
      - Generate meaningful comments and comprehensive documentation
      - Maintain consistent naming conventions and patterns
      - Preserve import statements, dependencies, and module structure
      - Use appropriate design patterns and best practices
      - Include proper error handling and type safety
      - Follow DRY principles and code organization standards
    
    abbreviations:
      func: function
      var: variable  
      const: constant
      obj: object
      arr: array
      str: string
      int: integer
      bool: boolean
      float: floating point
      async: asynchronous
      sync: synchronous
      api: application programming interface
      rest: representational state transfer
      graphql: graph query language
      sql: structured query language
      nosql: not only structured query language
      orm: object-relational mapping
      mvc: model-view-controller
      mvp: model-view-presenter
      mvvm: model-view-viewmodel
      crud: create read update delete
      oop: object-oriented programming
      fp: functional programming
      tdd: test-driven development
      bdd: behavior-driven development
      ci: continuous integration
      cd: continuous deployment
      devops: development operations
      ide: integrated development environment
      lsp: language server protocol

    
    terminology:
      - function
      - method
      - class
      - interface
      - abstract
      - inheritance
      - polymorphism
      - encapsulation
      - composition
      - dependency injection
      - design pattern
      - algorithm
      - data structure
      - recursion
      - iteration
      - concurrency
      - parallelism
      - asynchronous
      - callback
      - promise
      - async await
      - exception handling
      - debugging
      - profiling
      - optimization
      - refactoring
      - code review
      - unit testing
      - integration testing
      - documentation
      - version control
      - branching strategy
      - deployment
    
    extra_context:
      - "hyprctl activewindow -j 2>/dev/null || true"
    
    llm_config:
      provider: xai
      model: grok-3-mini
      temperature: 0.6
      max_tokens: 10000 
    
    output_format: code
    memory_scope: persistent
    memory_tags: ["development", "coding", "programming", "ide"]
    context_window_size: 8192
    dataset_name: "code_editor_context"
    
    shortcuts:
      save: "Ctrl+S"
      save_all: "Ctrl+Shift+S"
      undo: "Ctrl+Z"
      redo: "Ctrl+Y"
      find: "Ctrl+F"
      replace: "Ctrl+H"
      comment: "Ctrl+/"
      format: "Shift+Alt+F"
      go_to_line: "Ctrl+G"
      go_to_definition: "F12"
      rename: "F2"
      
    patterns:
      - "*Visual Studio Code*"
      - "*VSCode*"
      - "*Code - OSS*"
      - "*Cursor*"
      - "*Windsurf*"
      - "*IntelliJ IDEA*"
      - "*PyCharm*"
      - "*WebStorm*"
      - "*Android Studio*"
      - "*Sublime Text*"
      - "*Atom*"
      - "*Vim*"
      - "*Neovim*"
      - "*Emacs*"
      
    mcp_tools:
      - "Sourcegraph-eycpis"
      - "Context7"
      - "Mem0-rp8a7l"
      - "exa"
      - "Perplexity-search"
      - "swagger-mcp-server"
      - "toolbox"
    
    system_prompt: |
      You are an advanced code development assistant focused on producing high-quality, maintainable software.

      CORE DEVELOPMENT PRINCIPLES:
      - Generate clean, readable code following established language conventions
      - Create comprehensive documentation with clear examples
      - Implement robust error handling and input validation  
      - Follow SOLID principles and appropriate design patterns
      - Maintain consistent code formatting and style
      - Optimize for performance while prioritizing readability
      - Include meaningful variable names and function signatures
      - Apply security best practices and avoid common vulnerabilities

      LANGUAGE-SPECIFIC EXCELLENCE:
      - Python: PEP 8 compliance, type hints, comprehensive docstrings
      - JavaScript/TypeScript: ESLint standards, JSDoc comments, modern syntax
      - Java: Oracle conventions, JavaDoc, proper exception handling
      - C/C++: Standard conventions, memory management, Doxygen documentation
      - Go: Idiomatic Go patterns, godoc format, effective error handling
      - Rust: Safety-first approach, comprehensive documentation, cargo conventions
      - PHP: PSR standards, proper namespace usage, security considerations
      - Ruby: Ruby conventions, RDoc format, idiomatic patterns

      CODE QUALITY FOCUS:
      - Maintainability over cleverness
      - Clear separation of concerns
      - Appropriate abstraction levels
      - Comprehensive testing considerations
      - Version control friendly structure
      - Team collaboration ready formatting

  # Terminal and command-line functionality
  terminal_interface: &terminal_interface
    app_name: terminal_interface
    app_class: terminal
    writing_style: command_precise
    context_rules:
      - Output executable commands with exact syntax
      - Preserve shell-specific syntax and conventions
      - Maintain proper spacing and special characters
      - Never add unnecessary quotes or modifications
      - Keep pipe chains and redirections intact
      - Preserve environment variables and expansions
      - Use standard Unix conventions and flags
      - Prioritize accuracy over explanation
    
    abbreviations:
      dir: directory
      dirs: directories
      repo: repository
      config: configuration
      conf: configuration
      env: environment
      dev: development
      prod: production
      src: source
      dest: destination
      perms: permissions
      proc: process
      procs: processes
      sys: system
      admin: administrator
      tmp: temporary
      usr: user
      grp: group
      lib: library
      libs: libraries
      bin: binary
      exec: executable
      script: shell script
      daemon: background process
      service: system service
      mount: filesystem mount
      umount: filesystem unmount
      net: network
      iface: interface
      pkg: package
      dist: distribution
      arch: architecture
      kernel: operating system kernel
    
    terminology:
      - shell
      - bash
      - zsh
      - fish
      - command line
      - terminal
      - console
      - pipeline
      - redirection
      - pipe
      - filter
      - stream
      - stdin
      - stdout  
      - stderr
      - process
      - subprocess
      - background job
      - foreground job
      - daemon
      - service
      - cron
      - systemd
      - environment variable
      - path
      - alias
      - function
      - script
      - regular expression
      - glob pattern
      - wildcard
      - file permissions
      - ownership
      - filesystem
      - mount point
      - symbolic link
      - hard link
      - archive
      - compression
      - package management
      - system administration
    
    extra_context:
      - "pwd"
      - "whoami"
      - "echo $SHELL"
      - "uname -a"
      - "date '+%Y-%m-%d %H:%M:%S'"
      - "history | tail -5"
      - "ls -la | head -3"
      - "ps aux --sort=-%cpu | head -3"
      - "df -h / 2>/dev/null | tail -1"
      - "echo $PATH | tr ':' '\n' | head -5"
      - "hyprctl activewindow -j 2>/dev/null || true"
    
    llm_config:
      provider: xai
      model: grok-3-mini
      temperature: 0.6
      max_tokens: 10000 
    
    output_format: text
    memory_scope: session
    memory_tags: ["terminal", "cli", "command", "shell", "bash"]
    context_window_size: 4096
    dataset_name: "terminal_context"
    
    shortcuts:
      copy: "Ctrl+Shift+C"
      paste: "Ctrl+Shift+V"
      interrupt: "Ctrl+C"
      clear: "Ctrl+L"
      search: "Ctrl+R"
      tab_complete: "Tab"
      cancel: "Ctrl+D"
      suspend: "Ctrl+Z"
      
    patterns:
      - "*kitty*"
      - "*alacritty*"
      - "*konsole*"
      - "*gnome-terminal*"
      - "*terminator*"
      - "*xterm*"
      - "*urxvt*"
      - "*st*"
      - "*wezterm*"
      - "*Terminal*"
      
    mcp_tools:
      - "remote-shell-terminal-mcp"
      - "toolbox"
      - "Context7"
      - "Perplexity-search"
      - "exa"
    
    system_prompt: |
      You are a command-line interface assistant specializing in Unix/Linux system operations.

      COMMAND GENERATION RULES:
      - Output ONLY executable commands without explanations
      - Preserve exact syntax, spacing, and punctuation
      - Use standard POSIX-compliant commands when possible
      - Maintain proper flag syntax and parameter order
      - Keep pipe chains, redirections, and logical operators intact
      - Preserve environment variables, expansions, and special characters
      - Default to the most commonly used and reliable command variants
      - Ensure commands are safe and non-destructive unless explicitly requested

      SHELL COMPATIBILITY:
      - Prioritize POSIX compliance for maximum compatibility
      - Use bash-specific features only when necessary
      - Support common shells (bash, zsh, fish) appropriately
      - Handle different operating system variants (Linux, macOS, BSD)

      SAFETY AND BEST PRACTICES:
      - Prefer safer command variants (e.g., 'rm -i' for interactive deletion)
      - Use appropriate permissions and privilege escalation
      - Include error checking in complex command chains
      - Optimize for both correctness and efficiency

  # Messaging and communication functionality  
  instant_messaging: &instant_messaging
    app_name: instant_messaging
    app_class: messaging
    writing_style: conversational
    context_rules:
      - Maintain natural, engaging conversation flow
      - Fix obvious errors while preserving casual tone
      - Consider message threading and reply context
      - Handle both individual and group communication
      - Support multimedia and rich content context
      - Be mindful of international communication styles
      - Optimize for mobile and desktop messaging
      - Preserve informal expressions and personality
    
