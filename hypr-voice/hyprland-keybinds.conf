# Hypr-Voice keybindings for Hyprland
# Add this to your ~/.config/hypr/hyprland.conf

# Hold Super+` (backtick/grave) to record voice
# Start recording when pressed
bindr = SUPER, grave, exec, /home/mewtwo/Code/Hypr-V/hypr-voice/hypr-voice-control.sh start

# Stop recording when released
bindrt = SUPER, grave, exec, /home/mewtwo/Code/Hypr-V/hypr-voice/hypr-voice-control.sh stop

# Alternative: Use Super+Shift+V for toggle recording
# bind = SUPER SHIFT, V, exec, /home/mewtwo/Code/Hypr-V/hypr-voice/hypr-voice-control.sh toggle

# Optional: Show status
bind = SUPER SHIFT, grave, exec, /home/mewtwo/Code/Hypr-V/hypr-voice/hypr-voice-control.sh status
