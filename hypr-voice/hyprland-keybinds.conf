# Hypr-Voice Keybind Configuration for Hyprland
# Add these lines to your ~/.config/hypr/hyprland.conf file

# =============================================================================
# HYPR-VOICE KEYBINDS - RAW AND ENHANCED MODES
# =============================================================================

# F11 - Raw Mode (Fast transcription, no AI enhancement)
# Press and hold F11 for push-to-talk raw transcription
bind = , F11, exec, /path/to/hypr-voice/hypr-voice-control-extended.sh start-raw
bindl = , F11, exec, /path/to/hypr-voice/hypr-voice-control-extended.sh stop

# F12 - Enhanced Mode (AI-improved transcription)  
# Press and hold F12 for push-to-talk enhanced transcription
bind = , F12, exec, /path/to/hypr-voice/hypr-voice-control-extended.sh start-enhanced
bindl = , F12, exec, /path/to/hypr-voice/hypr-voice-control-extended.sh stop

# Alternative: Use current default mode (set via toggle)
# Uncomment these if you prefer F11/F12 to use the current default mode
# bind = , F11, exec, /path/to/hypr-voice/hypr-voice-control-extended.sh start
# bindl = , F11, exec, /path/to/hypr-voice/hypr-voice-control-extended.sh stop

# =============================================================================
# MODE MANAGEMENT KEYBINDS
# =============================================================================

# SUPER + F11 - Toggle between raw and enhanced modes
bind = SUPER, F11, exec, /path/to/hypr-voice/hypr-voice-control-extended.sh toggle-raw-mode && notify-send "Hypr-Voice" "Mode: $(cat /tmp/hypr-voice-raw-mode.state 2>/dev/null || echo enhanced)"

# SUPER + F12 - Show current status and mode
bind = SUPER, F12, exec, /path/to/hypr-voice/hypr-voice-control-extended.sh status | head -1 | xargs -I {} notify-send "Hypr-Voice" "{}"

# =============================================================================
# EMERGENCY CONTROLS
# =============================================================================

# SUPER + SHIFT + F12 - Force stop recording (emergency)
bind = SUPER SHIFT, F12, exec, /path/to/hypr-voice/hypr-voice-control-extended.sh force-stop && notify-send "Hypr-Voice" "Force stopped"

# =============================================================================
# QUICK MODE SWITCHING (Optional)
# =============================================================================

# SUPER + R - Set to raw mode
bind = SUPER, R, exec, /path/to/hypr-voice/hypr-voice-control-extended.sh set-raw-mode && notify-send "Hypr-Voice" "Raw mode enabled"

# SUPER + E - Set to enhanced mode  
bind = SUPER, E, exec, /path/to/hypr-voice/hypr-voice-control-extended.sh set-enhanced-mode && notify-send "Hypr-Voice" "Enhanced mode enabled"

# =============================================================================
# USAGE INSTRUCTIONS
# =============================================================================

# Raw Mode (F11):
# - Fast processing (200-500ms)
# - No AI enhancement
# - Perfect for CLI commands, quick notes
# - 89% accuracy, minimal resource usage

# Enhanced Mode (F12):  
# - Slower processing (800-1500ms)
# - AI-powered text improvement
# - Perfect for documents, emails, creative writing
# - 95%+ accuracy, context-aware enhancement

# Mode Management:
# - SUPER + F11: Toggle between modes
# - SUPER + F12: Check current mode and status
# - SUPER + R: Force raw mode
# - SUPER + E: Force enhanced mode

# Emergency:
# - SUPER + SHIFT + F12: Force stop if stuck

# =============================================================================
# INSTALLATION INSTRUCTIONS
# =============================================================================

# 1. Replace "/path/to/hypr-voice/" with your actual hypr-voice directory path
# 2. Make the control script executable:
#    chmod +x /path/to/hypr-voice/hypr-voice-control-extended.sh
# 3. Add these keybinds to your ~/.config/hypr/hyprland.conf
# 4. Reload Hyprland: hyprctl reload
# 5. Test with F11 (raw) and F12 (enhanced)

# =============================================================================
# CUSTOMIZATION OPTIONS
# =============================================================================

# You can customize these keybinds by changing:
# - Key combinations (F11, F12, etc.)
# - Modifier keys (SUPER, ALT, CTRL, SHIFT)
# - Notification messages
# - Script paths

# Example alternative keybinds:
# bind = ALT, grave, exec, /path/to/hypr-voice/hypr-voice-control-extended.sh start-raw    # ALT + `
# bind = ALT SHIFT, grave, exec, /path/to/hypr-voice/hypr-voice-control-extended.sh start-enhanced  # ALT + SHIFT + `