# Hypr-Voice Push-to-Talk Configuration
# Add this to your Hyprland config: source = ~/.config/hypr/hyprvoice.conf
# Or copy these bindings to your main hyprland.conf

# ============================================================================
# PUSH-TO-TALK KEYBINDINGS - DIRECT MODE (No daemon needed)
# ============================================================================

# F9 Press - Start recording (with notification)
bind = , F9, exec, /home/mewtwo/Zykairotis/Hypr-Voice/scripts/hypr-voice-record.sh start

# F9 Release - Stop recording and transcribe
bindr = , F9, exec, /home/mewtwo/Zykairotis/Hypr-Voice/scripts/hypr-voice-record.sh stop

# ============================================================================
# AGENT MODE KEYBINDINGS (Voice-to-Agent Pipeline)
# ============================================================================

# F10 Press - Start agent recording
bind = , F10, exec, /home/mewtwo/Zykairotis/Hypr-Voice/scripts/hypr-agent.sh start

# F10 Release - Process and send to orchestrator
bindr = , F10, exec, /home/mewtwo/Zykairotis/Hypr-Voice/scripts/hypr-agent.sh process

# ============================================================================
# ALTERNATIVE KEYBINDINGS
# ============================================================================

# Option 2: Use Super+F9 for push-to-talk (avoids conflicts)
# bind = SUPER, F9, exec, echo "start" | nc -N localhost 9876
# bindr = SUPER, F9, exec, echo "stop" | nc -N localhost 9876

# Option 3: Use dedicated key like Pause/Break
# bind = , Pause, exec, echo "start" | nc -N localhost 9876
# bindr = , Pause, exec, echo "stop" | nc -N localhost 9876

# Option 4: Use mouse button (e.g., Mouse4/5 for side buttons)
# bind = , mouse:276, exec, echo "start" | nc -N localhost 9876
# bindr = , mouse:276, exec, echo "stop" | nc -N localhost 9876

# ============================================================================
# QUICK COMMANDS
# ============================================================================

# Super+Alt+V - Toggle voice typing mode (start/stop daemon)
bind = SUPER_ALT, V, exec, systemctl --user restart hypr-voice.service

# Super+Alt+R - Quick record and type (one-shot mode)
bind = SUPER_ALT, R, exec, /home/mewtwo/Zykairotis/Hypr-Voice/scripts/hypr-voice-quick.sh

# ============================================================================
# VISUAL FEEDBACK (Optional)
# ============================================================================

# Show recording indicator when F9 is pressed
# Requires eww, waybar, or similar status bar
# bind = , F9, exec, eww update recording=true
# bindr = , F9, exec, eww update recording=false
