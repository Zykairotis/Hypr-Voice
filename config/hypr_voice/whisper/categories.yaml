# Dynamic detection settings
detection:
  use_desktop_files: true
  fallback_to_heuristics: true
  cache_results: true
  cache_ttl: 3600  # seconds
  
  # Heuristic patterns for categorization when desktop file not found
  heuristics:
    terminal_keywords:
      - term
      - console
      - shell
      - tty
      - bash
      - zsh
      - fish
    
    browser_keywords:
      - browser
      - web
      - firefox
      - chrome
      - chromium
    
    editor_keywords:
      - edit
      - code
      - vim
      - emacs
      - nano
    
    media_keywords:
      - player
      - video
      - audio
      - music
      - sound

