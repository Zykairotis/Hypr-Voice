settings:
  enhancement_method: prompt_engineering
  prompt_engineering:
    include_in_initial_prompt: true
    prompt_template: 'Transcribe the following audio accurately. Pay special attention
      to these terms:

      {vocabulary_terms}


      If unsure about a term, use the closest match from the list above.

      Context: {application_context}

      '
    max_prompt_length: 200
  post_processing:
    enabled: true
    fuzzy_matching: true
    confidence_threshold: 0.7
    correction_strategies:
    - levenshtein_distance
    - phonetic_similarity
    - context_aware
  hotwords:
    enabled: false
    boost_factor: 1.5
    custom_words: []
detection:
  method: hyprland
  update_interval: 200
  fallback_vocabulary: global
  context_sources:
    shell_history: 40
    clipboard_history: 5
