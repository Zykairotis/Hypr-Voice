[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hypr-voice"
version = "0.1.0"
description = "Multi-agent orchestration with voice synthesis, Whisper STT, and Claude integration."
readme = "docs/hypr_voice/README.md"
requires-python = ">=3.10"
authors = [{ name = "Hypr Voice Team" }]
license = { text = "Proprietary" }
dependencies = [
    # Core Web Framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.24.0",
    "websockets>=12.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.3.0",
    "python-multipart>=0.0.6",
    "starlette>=0.41.0",

    # Async Support
    "aiohttp>=3.9.0",
    "aiofiles>=23.2.0",
    "asyncio-mqtt>=0.16.0",

    # Claude SDK Integration
    "claude-agent-sdk>=0.1.10",

    # Voice Synthesis Services
    "elevenlabs>=1.9.0",
    "deepgram-sdk>=3.8.0",
    "kokoro-onnx>=0.1.0",

    # Speech Recognition & Audio
    "faster-whisper>=1.0.0",
    "ctranslate2>=4.0.0",
    "openai-whisper>=20240930",
    "whisper-live>=0.7.0",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "soundfile>=0.12.0",
    "pyaudio>=0.2.14",
    "scipy>=1.10.0",
    "librosa>=0.10.0",
    "sounddevice>=0.4.0",
    "pygtrie>=2.5.0",
    "ffmpeg-python>=0.2.0",

    # Multi-Provider LLM Support
    "litellm>=1.17.0",
    "openai>=1.6.0",
    "anthropic>=0.8.0",
    "cohere>=4.37",

    # Screen Analysis & Computer Vision
    "google-generativeai>=0.8.0",
    "Pillow>=10.0.0",
    "mss>=9.0.0",

    # Hugging Face / ML
    "transformers>=4.30.0",
    "accelerate>=0.20.0",
    "datasets>=2.12.0",
    "huggingface-hub>=0.16.0",
    "tokenizers>=0.13.0",
    "safetensors>=0.3.0",

    # Configuration & Environment
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0.0",
    "toml>=0.10.2",
    "configparser>=6.0.0",

    # Rich Terminal UI
    "rich>=13.7.0",
    "textual>=0.41.0",
    "blessed>=1.20.0",
    "colorama>=0.4.6",
    "questionary>=2.0.1",

    # Logging & Monitoring
    "loguru>=0.7.2",
    "prometheus-client>=0.19.0",
    "structlog>=23.2.0",

    # Data Processing
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "jinja2>=3.1.0",

    # JSON & Validation
    "jsonschema>=4.20.0",
    "json5>=0.9.0",
    "ujson>=5.9.0",

    # Date/Time
    "python-dateutil>=2.8.0",
    "pytz>=2023.3",
    "croniter>=2.0.0",

    # Process & System
    "psutil>=5.9.0",
    "schedule>=1.2.0",

    # HTTP & Network
    "httpx>=0.24.0",
    "requests>=2.31.0",

    # Security
    "cryptography>=41.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.0",

    # MCP Protocol
    "mcp>=0.9.0",

    # CLI & Utilities
    "click>=8.1.0",
    "typer>=0.9.0",
    "tenacity>=8.2.0",
    "tqdm>=4.65.0",
    "humanize>=4.9.0",
    "python-slugify>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "black>=23.11.0",
    "flake8>=6.1.0",
    "isort>=5.12.0",
    "mypy>=1.7.0",
    "coverage>=7.3.0",
]

docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.4.0",
    "mkdocstrings[python]>=0.24.0",
]

langchain = [
    "langchain>=0.1.0",
    "langchain-core>=0.1.52",
    "langgraph>=0.0.20",
    "langchain-community>=0.0.20",
    "langchain-openai>=0.0.5",
    "langchain-anthropic>=0.1.0",
    "sse-starlette>=1.6.0",
    "langgraph-checkpoint>=1.0.0",
    "tavily-python>=0.3.0",
]

all = [
    "hypr-voice[dev,docs,langchain]",
]

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["hypr_voice"]

[project.scripts]
hypr-voice-tts = "hypr_voice.cli.tts:run"

# =============================================================================
# Tool Configuration
# =============================================================================

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  \.git
  | \.mypy_cache
  | \.ruff_cache
  | \.venv
  | build
  | dist
  | __pypackages__
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
asyncio_mode = "auto"
testpaths = ["tests", "src/hypr_voice/tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
python_classes = ["Test*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
